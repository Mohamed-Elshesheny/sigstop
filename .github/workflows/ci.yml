name: CI

# Everything this repository claims about itself is already checked by a command. The
# only thing missing was something that runs them without being asked.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A second push cancels the first. Nothing here is worth finishing for a commit that has
# already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Without this a step runs as `bash -e`, and `make test | tee` took tee's exit status, so a
# failing test left the step green. `shell: bash` adds pipefail.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Build, test, and prove the claims
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show the toolchain
        run: swift --version && xcode-select -p

      - name: Build
        working-directory: app
        run: swift build -c release

      # Runs badges-check first as a prerequisite, so a badge renamed here without the
      # site being told fails the build rather than drifting quietly.
      - name: Test
        working-directory: app
        run: make test | tee "$RUNNER_TEMP/test.log"

      # The README's test-count badge, against the run that just happened. It said 281
      # while the suite ran 288, on the front page of a repository that invites people to
      # check its claims.
      - name: The README's test count is the real one
        run: python3 .github/scripts/check-test-count.py "$RUNNER_TEMP/test.log"

      # The humour rails, which docs/MESSAGE-ENGINE.md §4 pointed at a lint that did not exist.
      # Hard failures are the ones a machine can decide; the rest of the rubric stays
      # human and the pull request template asks a reviewer to tick it.
      - name: Corpus lint
        run: python3 .github/scripts/check-corpus.py

      # docs/PRIVACY.md tells a suspicious reader that Accessibility lives in one file.
      # It named a file that has never existed and a workflow that did not run. Both are
      # real now, and this is the one that keeps the claim true.
      - name: Accessibility stays in the two files PRIVACY.md names
        run: python3 .github/scripts/check-ax-isolation.py

      # The privacy claims, asserted against the built binary rather than the source:
      # no networking symbol in the app's own executable, exactly one embedded framework,
      # no analytics SDK, one endpoint, nothing scheduled.
      - name: Verify the privacy properties
        working-directory: app
        run: make verify

      # Everything above this runs on the machine that built the thing, which is exactly
      # why a build that died on every OTHER machine passed all of it and reached users.
      # This one copies the .app away from the tree, hides the build directory, hands it a
      # pristine HOME and asks the running app what it can actually see.
      - name: The shipped app runs on a machine that is not the build machine
        working-directory: app
        run: make smoke

      # Fourteen scripted days against the real engine. The unit tests answer "does this
      # branch do what it says"; this answers "does a whole day ever go quiet".
      - name: Run the scenarios
        working-directory: app
        run: swift run -c release Scenarios

      - name: Check the disk image still builds
        working-directory: app
        run: make dmg

      - name: The Intel slice runs too
        working-directory: app
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          REQUIRE_X86=1 BUNDLE=dist/sigstop.app ./Scripts/smoke.sh
