<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- The touch icon needs a plate: iOS composites it with no background. -->
  <defs>
    <clipPath id="l"><rect x="52" y="42" width="30" height="96" rx="8"/></clipPath>
    <clipPath id="r"><rect x="98" y="42" width="30" height="96" rx="8"/></clipPath>
  </defs>
  <rect width="180" height="180" rx="40" fill="#0d0f12"/>
  <g fill="none" stroke="#f5a524" stroke-width="8">
    <rect x="56"  y="46" width="22" height="88" rx="5"/>
    <rect x="102" y="46" width="22" height="88" rx="5"/>
  </g>
  <g fill="#f5a524">
    <rect x="52" y="90" width="30" height="48" clip-path="url(#l)"/>
    <rect x="98" y="90" width="30" height="48" clip-path="url(#r)"/>
  </g>
</svg>
