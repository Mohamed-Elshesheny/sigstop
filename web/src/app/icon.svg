<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Half filled, matching the nav wordmark. The outline is the whole session
       and the fill is how much of it has elapsed, which is the same idea the
       menu bar icon animates: the mark IS the timer. -->
  <defs>
    <clipPath id="l"><rect x="7"  y="5" width="7" height="22" rx="2"/></clipPath>
    <clipPath id="r"><rect x="18" y="5" width="7" height="22" rx="2"/></clipPath>
  </defs>
  <g fill="none" stroke="#f5a524" stroke-width="2">
    <rect x="8"  y="6" width="5" height="20" rx="1.4"/>
    <rect x="19" y="6" width="5" height="20" rx="1.4"/>
  </g>
  <g fill="#f5a524">
    <rect x="7"  y="16" width="7" height="11" clip-path="url(#l)"/>
    <rect x="18" y="16" width="7" height="11" clip-path="url(#r)"/>
  </g>
</svg>
