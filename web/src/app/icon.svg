<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Matches the nav wordmark exactly: two solid amber bars, no plate behind
       them. Transparent works on a light or a dark browser tab because amber
       carries enough contrast against both. -->
  <rect x="7"  y="5" width="7" height="22" rx="2" fill="#f5a524"/>
  <rect x="18" y="5" width="7" height="22" rx="2" fill="#f5a524"/>
</svg>
